# The scheduled ephemeral sweep - mootmaker/designs/archive/ci-cd-pipeline.md, rollout step 11.
#
# GRADUATED to automatic teardown 2026-10-05 (mootmaker#51). The design asked for a report-only
# trial first; a month of daily reports (2026-09-04 to 10-04) found every category behaving, with
# one real false positive: environments a person still wanted looked exactly like abandoned ones,
# because the age guard measures state writes rather than use. Two changes answered it - a KEEP
# marker (keep-env.sh) the sweep honours, and an age guard of 48h instead of 12h - and the sweep
# then graduated. Every report is still kept as an artifact for 90 days.
#
# Scheduled runs always pass --destroy. A manual dispatch defaults to it too, and can untick it for
# a report-only look.
#
# One narrow exception runs in every mode: AppSync log groups whose API no longer exists are
# deleted (mootmaker#71), since that is a fact the script can check rather than a judgement about
# whether an environment is abandoned.
#
# Deliberately NOT shipped to CloudWatch, unlike every release stage. Decision 11 ships logs keyed
# by release version, and this workflow has no version to key on - it is periodic, not part of any
# one release. The design says so explicitly. The run's own log in Actions is the record.
name: Sweep stale ephemeral environments

on:
  schedule:
    # 06:00 UTC daily. After any overnight release has finished, and the 48-hour staleness
    # threshold in the script means a run still going could not be swept regardless.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      destroy:
        description: 'Actually tear down what is found (untick for a report-only run)'
        type: boolean
        default: true
      max_age_hours:
        description: 'Only consider environments untouched for this many hours'
        type: string
        default: '48'

# One sweep at a time. Two concurrent sweeps would race on the same teardowns, and the second
# would find state the first had already emptied. Not cancel-in-progress: a sweep mid-teardown must
# finish, or it strands the environment it was halfway through destroying - the exact failure this
# workflow exists to clean up after.
concurrency:
  group: sweep-stale-envs
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # teardown-ephemeral-env.sh discovers what is deployed from S3 and then calls each
      # component's own undeploy.sh, which it expects to find as a SIBLING directory. So the
      # checkout layout has to mirror a developer workstation, not the usual single-repo one.
      # Checked out even in report-only mode: graduating to --destroy should be a flag change, not
      # a workflow rewrite that is untested until the first time it matters.
      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-api
          path: siblings/mootmaker-api
      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-webapp
          path: siblings/mootmaker-webapp
      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-demo-data
          path: siblings/mootmaker-demo-data
      # For the account-wide accumulation check below, which lives with the other account checks.
      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-bootstrap-aws-accounts
          path: siblings/mootmaker-bootstrap-aws-accounts

      # undeploy.sh shells out to terraform; the runner has none preinstalled. Without this a
      # --destroy sweep fails with "terraform: command not found" - which is how an ephemeral
      # environment gets stranded in the first place.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::431071856068:role/mootmaker-release-github-actions-deploy
          aws-region: us-east-1

      # The scripts resolve siblings relative to their own location, so the sweep has to run from a
      # directory that HAS those siblings. Copying the three scripts next to the checked-out
      # component repos is what makes ../mootmaker-api resolve.
      - name: Arrange the workstation-shaped layout the scripts expect
        run: |
          mkdir -p siblings/mootmaker-ephemeral-envs
          cp sweep-stale-envs.sh teardown-ephemeral-env.sh siblings/mootmaker-ephemeral-envs/
          chmod +x siblings/mootmaker-ephemeral-envs/*.sh

      - name: Sweep
        run: |
          # pipefail because of the `| tee` below. Without it the step's exit status is tee's, so a
          # sweep that died on an AWS permissions error reports green having produced nothing -
          # which is exactly what happened on the first CI run of this workflow.
          set -o pipefail
          # A scheduled run has no inputs at all - both expressions below are empty for it - so the
          # schedule's own behaviour is spelled out here rather than inherited from input defaults,
          # which only apply to a manual dispatch.
          args=(--max-age-hours "${{ inputs.max_age_hours || '48' }}")
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.destroy }}" == "true" ]]; then
            args+=(--destroy)
          fi
          ./siblings/mootmaker-ephemeral-envs/sweep-stale-envs.sh "${args[@]}" | tee sweep-report.txt

      # Anything growing with time rather than use (mootmaker#77): log groups without retention,
      # Lambda versions past what pruning keeps, a stalled history-cleanup job. Rides on this
      # schedule because it is the daily account-hygiene run and already holds a role that can make
      # every call. always() so a sweep failure does not hide it; it exits 1 on a finding, which
      # turns this run red - that is the notification, with no paid CloudWatch alarm behind it.
      - name: Accumulation check
        if: always()
        run: ./siblings/mootmaker-bootstrap-aws-accounts/check-accumulation.sh

      # The report was the entire point of the trial period, and is now the record of what an
      # unattended run destroyed. An Actions log is gone in 90 days; keeping it as an artifact is
      # what makes "what did the sweep remove, and why" answerable from something other than memory.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sweep-report
          path: sweep-report.txt
          retention-days: 90
